{% extends 'base.html' %}
{% block title %}个人资料 - 计算机俱乐部{% endblock %}
{% block content %}
<section class="auth-page">
    <p class="eyebrow">YOUR PROFILE</p>
    <h1>个人资料。</h1>
    <p class="meta">真实姓名由管理员保管。你可以随时更新昵称和头像。</p>
    <form method="post" enctype="multipart/form-data" class="auth-form">
        {% csrf_token %}
        {% for field in form %}
            <label>{{ field.label }}{{ field }}{% for error in field.errors %}<small class="form-error">{{ error }}</small>{% endfor %}</label>
        {% endfor %}
        <button class="button" type="submit">保存资料 <span>→</span></button>
    </form>
</section>
{% endblock %}
